name: "Sanity checks"
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  sanity:
    name: "build and test"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go-version: [1.26.x]
        os: [ubuntu-latest]
    steps:
      - name: "install golang"
        uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: "checkout code"
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: "build appliation"
        run: |
          set -euxo pipefail
          cd ${{ github.workspace }}
          go build -o build/psfv
          build/psfv --help
          build/psfv version
